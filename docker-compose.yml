services:
  # Esecuzione continua: il container rimane attivo, cron esegue monitor.py
  # ogni 2 ore dalle 06:00 alle 22:00.
  # Avvio:  docker compose up -d
  # Log:    tail -f state/monitor.log
  ic-lentate-alert:
    build: .
    container_name: ic_lentate_alert
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app    # monta l'intera cartella del progetto: state/, monitor.py, run.sh, ecc.

  # Test manuale one-shot: esegue monitor.py una volta sola e termina.
  # Non parte con `docker compose up -d` (profilo "test").
  # Avvio: docker compose --profile test run --rm ic-lentate-alert-test
  ic-lentate-alert-test:
    build: .
    container_name: ic_lentate_alert_test
    profiles: ["test"]
    env_file:
      - .env
    volumes:
      - .:/app
    entrypoint: ["python", "/app/monitor.py"]